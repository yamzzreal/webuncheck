<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yamzz Mail</title>
<style>
:root{--bg:#070b13;--panel:#0c1322;--line:#1c2d4a;--text:#edf4ff;--muted:#74839c;--blue:#2879ff;--cyan:#45c8ff;--green:#29d09a;--orange:#ffb10e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial;padding-bottom:30px}.top{height:72px;background:#10131c;border-bottom:1px solid #20283a;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:5}.logo{width:42px;height:42px;border-radius:9px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900;font-size:12px}.brand{font-weight:900;font-size:18px;flex:1}.pill{background:#17172b;color:#ad96ff;border:1px solid #3b315f;padding:8px 13px;border-radius:11px;max-width:135px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800}.menu{border:0;background:none;color:#d9e2ef;font-size:28px}.wrap{max-width:900px;margin:auto;padding:14px 15px}.tools{display:flex;gap:9px}.search{flex:1;min-width:0;background:#0a1020;border:1px solid #1e3152;color:#fff;border-radius:18px;padding:15px 18px;font-size:15px;outline:none}.live{border:1px solid #253754;background:#131b2d;color:#a8b4c9;border-radius:15px;padding:0 15px;font-weight:800}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#21c891;margin-right:5px}.count{color:#7b8aa2;font-size:14px;margin:14px 5px}.card{background:#0b1221;border:1px solid #1b2b48;border-radius:27px;padding:17px 15px;margin:12px 0;display:flex;gap:14px;cursor:pointer;transition:.15s}.card:hover{border-color:#31558d}.avatar{width:62px;height:62px;flex:0 0 62px;border-radius:15px;background:linear-gradient(135deg,#2e7bff,#1851cc);display:grid;place-items:center}.avatar svg{width:32px;height:32px;fill:white}.body{min-width:0;flex:1}.row{display:flex;gap:8px;align-items:center}.sender{color:var(--orange);font-weight:900;font-size:16px}.star{margin-left:auto;color:#71809a;font-size:24px}.subject{font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:7px;margin-top:9px}.tag{background:#142750;color:#74adff;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700}.tag.time{background:#0c3440;color:#42d5a7;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag.date{background:#151d31;color:#77849b}.empty,.error{padding:35px;text-align:center;color:var(--muted);border:1px dashed #263653;border-radius:20px;margin-top:20px}.error{color:#ff9da9}.refresh{margin-top:15px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800}
.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:15px;align-items:flex-end}.modal{width:min(900px,100%);max-height:88vh;overflow:auto;margin:auto;background:#0d1424;border:1px solid #243a5f;border-radius:25px;padding:0}.handle{width:50px;height:5px;border-radius:5px;background:#35405a;margin:14px auto}.modalHead{padding:0 20px 18px;border-bottom:1px solid #1e2940}.modalHead h2{margin:0 0 8px;font-size:20px}.meta{color:#8391a9;font-size:13px;line-height:1.6}.detail{padding:18px 20px}.label{color:#687892;font-size:12px;font-weight:900;letter-spacing:1.5px;margin:4px 0 9px}.from{color:#ffb10e;font-weight:900;word-break:break-all}.content{background:#09101e;border:1px solid #1d2b44;border-radius:14px;padding:15px;white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere;min-height:90px}.close{width:100%;border:0;background:#26334b;color:#e8f0fc;padding:14px;border-radius:12px;font-weight:900;margin-top:15px}
@media(max-width:520px){.brand{font-size:16px}.pill{max-width:105px}.card{border-radius:22px}.avatar{width:56px;height:56px;flex-basis:56px}.tag.time{max-width:42%}}
</style></head>
<body>
<header class="top"><div class="logo">YM</div><div class="brand">Yamzz Mail</div><div class="pill" id="account">INBOX</div><button class="menu" onclick="location.href='/login.html'">☰</button></header>
<main class="wrap"><div class="tools"><input class="search" id="search" placeholder="Cari email, pengirim, subject..."><button class="live" id="live"><span class="dot"></span>Live</button></div><div class="count" id="count">Memuat data...</div><div id="list"></div><button class="refresh" id="refresh">Refresh Inbox</button></main>
<div class="overlay" id="overlay"><article class="modal"><div class="handle"></div><div class="modalHead"><h2 id="mSubject">Pesan</h2><div class="meta" id="mMeta"></div></div><div class="detail"><div class="label">PENGIRIM</div><div class="from" id="mFrom"></div><div class="label" style="margin-top:18px">ISI PESAN</div><div class="content" id="mContent"></div><button class="close" id="close">TUTUP</button></div></article></div>
<script>
const $=id=>document.getElementById(id);let all=[];let live=true;let timer;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmt(d){if(!d)return "-";return new Date(d).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}
function icon(){return '<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>'}
function render(){const q=$("search").value.toLowerCase();const data=all.filter(m=>(m.from.email+" "+m.from.name+" "+m.subject+" "+m.snippet).toLowerCase().includes(q));$("count").textContent=data.length+" email";$("list").innerHTML=data.length?data.map((m,i)=>`<div class="card" data-i="${all.indexOf(m)}"><div class="avatar">${icon()}</div><div class="body"><div class="row"><div class="sender">${esc(m.from.name||m.from.email||"Pengirim")}</div><div class="star">☆</div></div><div class="subject">✉ ${esc(m.subject)} <span style="color:#b4bfd1">(${esc(m.from.email)})</span></div><div class="tags"><span class="tag">${m.seen?"Email":"Baru"}</span><span class="tag time">${esc(m.snippet||"Tidak ada preview")}</span><span class="tag date">${esc(fmt(m.date))}</span></div></div></div>`).join(""):'<div class="empty">Tidak ada email yang cocok.</div>';document.querySelectorAll(".card").forEach(x=>x.onclick=()=>openMsg(all[Number(x.dataset.i)]))}
async function load(){$("live").style.opacity=".6";try{const r=await fetch("/api/messages?limit=50",{cache:"no-store",credentials:"same-origin"});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(_){const preview=raw.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,220);throw new Error("API mengembalikan respons bukan JSON (HTTP "+r.status+"). "+(preview||"Periksa deployment /api/messages di Vercel."))}if(!r.ok||!d.success)throw new Error((d.message||("HTTP "+r.status))+(d.error?" — "+d.error:""));all=d.messages||[];$("account").textContent=(d.plan||"INBOX").toUpperCase();render()}catch(e){$("count").textContent="Gagal memuat";$("list").innerHTML='<div class="error">'+esc(e.message)+'</div>'}$("live").style.opacity="1"}
function openMsg(m){$("mSubject").textContent=m.subject||"Pesan";$("mFrom").textContent=(m.from.name?m.from.name+" ":"")+"<"+(m.from.email||"-")+">";$("mMeta").textContent="Diterima: "+fmt(m.date);$("mContent").textContent=m.text||"Email tidak memiliki teks yang dapat ditampilkan.";$("overlay").style.display="flex"}
$("close").onclick=()=>$("overlay").style.display="none";$("overlay").onclick=e=>{if(e.target===$("overlay"))$("overlay").style.display="none"};$("search").oninput=render;$("refresh").onclick=load;$("live").onclick=()=>{live=!live;$("live").innerHTML=live?'<span class="dot"></span>Live':'○ Paused';if(live){clearInterval(timer);timer=setInterval(load,15000)}else clearInterval(timer)};load();timer=setInterval(load,15000);
</script></body></html>
