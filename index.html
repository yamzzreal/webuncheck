<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>
        Yamzz Mail
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:
                #050c16;

            color: #fff;

            font-family:
                Arial,
                sans-serif;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {

            position: sticky;
            top: 0;

            z-index: 100;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            padding: 14px 16px;

            background:
                rgba(5, 15, 26, .94);

            border-bottom:
                1px solid
                rgba(255,255,255,.06);

            backdrop-filter:
                blur(12px);
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .brand-icon {

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background:
                #087cff;

            font-weight: 900;
        }


        .brand-name {

            font-size: 15px;

            font-weight: 800;
        }


        .brand-sub {

            margin-top: 2px;

            font-size: 10px;

            color:
                rgba(255,255,255,.45);
        }


        .account {

            padding:
                6px 10px;

            border-radius: 999px;

            background:
                rgba(0,136,255,.12);

            border:
                1px solid
                rgba(0,136,255,.25);

            color:
                #56b4ff;

            font-size: 10px;

            font-weight: 800;
        }


        /* =========================
           MAIN
        ========================= */

        main {

            width: 100%;

            max-width: 700px;

            margin:
                0 auto;

            padding:
                18px 14px 100px;
        }


        /* =========================
           SEARCH
        ========================= */

        .search-box {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 12px;
        }


        #search {

            width: 100%;

            height: 44px;

            padding:
                0 14px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 12px;

            outline: none;

            background:
                rgba(255,255,255,.04);

            color: #fff;

            font-size: 13px;
        }


        #search::placeholder {

            color:
                rgba(255,255,255,.35);
        }


        #search:focus {

            border-color:
                rgba(0,145,255,.45);
        }


        /* =========================
           ACTION BAR
        ========================= */

        .actions {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 14px;
        }


        button {

            border: 0;

            cursor: pointer;

            color: #fff;
        }


        .live-btn,
        .refresh-btn {

            height: 38px;

            padding:
                0 13px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.05);

            border:
                1px solid
                rgba(255,255,255,.07);

            font-size: 11px;

            font-weight: 700;
        }


        .live-btn {

            display: flex;

            align-items: center;

            gap: 6px;
        }


        .dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                #27e66f;

            box-shadow:
                0 0 8px
                #27e66f;
        }


        #count {

            margin-bottom: 12px;

            color:
                rgba(255,255,255,.45);

            font-size: 11px;
        }


        /* =========================
           EMAIL LIST
        ========================= */

        #list {

            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        .email-item {

            padding: 14px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.055);

            cursor: pointer;

            transition:
                .18s ease;
        }


        .email-item:hover {

            background:
                rgba(0,136,255,.07);

            border-color:
                rgba(0,136,255,.2);

            transform:
                translateY(-1px);
        }


        .email-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }


        .email-from {

            min-width: 0;

            font-size: 13px;

            font-weight: 700;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .email-date {

            flex-shrink: 0;

            font-size: 10px;

            color:
                rgba(255,255,255,.35);
        }


        .email-subject {

            margin-top: 7px;

            font-size: 12px;

            font-weight: 700;
        }


        .email-snippet {

            margin-top: 5px;

            color:
                rgba(255,255,255,.45);

            font-size: 11px;

            line-height: 1.5;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .empty,
        .error {

            padding: 30px 15px;

            text-align: center;

            color:
                rgba(255,255,255,.4);

            font-size: 12px;
        }


        .error {

            color:
                #ff7373;
        }


        /* =========================
           POPUP
        ========================= */

        .overlay {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 14px;

            background:
                rgba(0,0,0,.75);

            backdrop-filter:
                blur(8px);
        }


        .login-card {

            width: 100%;

            max-width: 430px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 20px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #0b1b30,
                    #07111f
                );

            border:
                1px solid
                rgba(0,174,255,.3);

            box-shadow:
                0 0 35px
                rgba(0,150,255,.18);

            animation:
                popupIn .2s ease;
        }


        @keyframes popupIn {

            from {

                opacity: 0;

                transform:
                    translateY(15px)
                    scale(.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================
           POPUP HEADER
        ========================= */

        .login-card-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;

            padding-bottom: 15px;

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }


        .login-card-title {

            font-size: 16px;

            font-weight: 800;

            letter-spacing: .7px;
        }


        .login-card-subtitle {

            margin-top: 4px;

            font-size: 10px;

            color:
                rgba(255,255,255,.4);
        }


        .close-btn {

            width: 36px;

            height: 36px;

            flex-shrink: 0;

            border-radius: 10px;

            background:
                rgba(255,255,255,.07);

            font-size: 24px;

            line-height: 1;
        }


        .close-btn:hover {

            background:
                rgba(255,255,255,.13);
        }


        /* =========================
           LOGIN INFO
        ========================= */

        .login-info {

            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        .info-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            min-height: 48px;

            padding:
                10px 13px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.055);
        }


        .info-item span {

            flex-shrink: 0;

            font-size: 11px;

            font-weight: 600;

            color:
                rgba(255,255,255,.48);
        }


        .info-item strong {

            max-width: 68%;

            overflow: hidden;

            text-align: right;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 12px;

            font-weight: 700;

            color: #fff;
        }


        @media (max-width: 480px) {

            main {

                padding-left: 10px;

                padding-right: 10px;
            }


            .login-card {

                padding: 16px;

                border-radius: 16px;
            }


            .info-item strong {

                max-width: 60%;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                YM
            </div>

            <div>

                <div class="brand-name">
                    Yamzz Mail
                </div>

                <div class="brand-sub">
                    Spam Inbox
                </div>

            </div>

        </div>


        <div
            id="account"
            class="account"
        >
            SPAM
        </div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <div class="search-box">

            <input
                id="search"
                type="search"
                placeholder="Cari email..."
                autocomplete="off"
            >

        </div>



        <div class="actions">

            <button
                id="live"
                class="live-btn"
                type="button"
            >
                <span class="dot"></span>
                Live
            </button>


            <button
                id="refresh"
                class="refresh-btn"
                type="button"
            >
                Refresh Inbox
            </button>

        </div>



        <div id="count">
            Memuat...
        </div>



        <div id="list">

            <div class="empty">
                Memuat email...
            </div>

        </div>

    </main>



    <!-- =========================
         LOGIN DETAIL POPUP
    ========================= -->

    <div
        id="overlay"
        class="overlay"
    >

        <div class="login-card">


            <div class="login-card-header">

                <div>

                    <div class="login-card-title">
                        DETAIL LOGIN
                    </div>

                    <div class="login-card-subtitle">
                        Informasi sesi
                    </div>

                </div>


                <button
                    id="close"
                    class="close-btn"
                    type="button"
                    aria-label="Tutup"
                >
                    ×
                </button>

            </div>



            <div class="login-info">


                <div class="info-item">

                    <span>
                        Email
                    </span>

                    <strong id="infoEmail">
                        -
                    </strong>

                </div>



                <div class="info-item">

                    <span>
                        Sandi
                    </span>

                    <strong id="infoPassword">
                        -
                    </strong>

                </div>



                <div class="info-item">

                    <span>
                        Login Via
                    </span>

                    <strong id="infoLoginVia">
                        -
                    </strong>

                </div>



                <div class="info-item">

                    <span>
                        IP
                    </span>

                    <strong id="infoIP">
                        -
                    </strong>

                </div>



                <div class="info-item">

                    <span>
                        Negara
                    </span>

                    <strong id="infoCountry">
                        -
                    </strong>

                </div>



                <div class="info-item">

                    <span>
                        Provinsi
                    </span>

                    <strong id="infoProvince">
                        -
                    </strong>

                </div>



                <div class="info-item">

                    <span>
                        Kota
                    </span>

                    <strong id="infoCity">
                        -
                    </strong>

                </div>



                <div class="info-item">

                    <span>
                        ASN
                    </span>

                    <strong id="infoASN">
                        -
                    </strong>

                </div>


            </div>

        </div>

    </div>



    <script>

        /* =========================
           GLOBAL
        ========================= */

        let all = [];

        let live = true;

        let timer = null;



        /* =========================
           SHORT SELECTOR
        ========================= */

        function $(id) {

            return document.getElementById(id);
        }



        /* =========================
           ESCAPE HTML
        ========================= */

        function esc(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }



        /* =========================
           FORMAT DATE
        ========================= */

        function fmt(value) {

            if (!value) {

                return "-";
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "-";
            }


            return date.toLocaleString(
                "id-ID",
                {
                    dateStyle: "short",
                    timeStyle: "short"
                }
            );
        }



        /* =========================
           GET DATA
        ========================= */

        function pick(...values) {

            for (
                const value
                of values
            ) {

                if (
                    value !== undefined &&
                    value !== null &&
                    String(value).trim() !== ""
                ) {

                    return String(value);
                }
            }


            return "-";
        }



        /* =========================
           RENDER EMAIL
        ========================= */

        function render() {

            const query =
                $("search")
                    .value
                    .trim()
                    .toLowerCase();


            const filtered =
                all.filter(message => {

                    const text = [

                        message.subject,

                        message.snippet,

                        message.text,

                        message.from?.name,

                        message.from?.email,

                        message.email,

                        message.ip,

                        message.city,

                        message.country

                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    return text.includes(
                        query
                    );
                });


            if (!filtered.length) {

                $("list").innerHTML = `
                    <div class="empty">
                        Tidak ada email yang cocok.
                    </div>
                `;

                return;
            }


            $("list").innerHTML =
                filtered.map(
                    (message, index) => `

                    <div
                        class="email-item"
                        onclick="openMsg(all[${all.indexOf(message)}])"
                    >

                        <div class="email-top">

                            <div class="email-from">
                                ${esc(
                                    message.from?.name ||
                                    message.from?.email ||
                                    message.email ||
                                    "-"
                                )}
                            </div>

                            <div class="email-date">
                                ${esc(
                                    fmt(message.date)
                                )}
                            </div>

                        </div>


                        <div class="email-subject">

                            ${esc(
                                message.subject ||
                                "Pesan"
                            )}

                        </div>


                        <div class="email-snippet">

                            ${esc(
                                message.snippet ||
                                message.text ||
                                "-"
                            )}

                        </div>

                    </div>

                `
                ).join("");
        }



        /* =========================
           LOAD INBOX
        ========================= */

        async function load() {

            try {

                $("live").style.opacity =
                    ".5";


                const response =
                    await fetch(
                        "/api/messages?limit=50",
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch (_) {

                    data = null;
                }


                if (
                    !response.ok ||
                    !data?.success
                ) {

                    throw new Error(
                        data?.message ||
                        (
                            "HTTP " +
                            response.status
                        ) +
                        (
                            data?.error
                                ? " — " +
                                  data.error
                                : ""
                        )
                    );
                }


                all =
                    Array.isArray(
                        data.messages
                    )
                        ? data.messages
                        : [];


                $("account").textContent =
                    (
                        data.mailbox ||
                        data.folder ||
                        data.plan ||
                        "SPAM"
                    ).toUpperCase();


                if (
                    typeof data.unseen ===
                    "number"
                ) {

                    $("count").textContent =
                        `${all.length} email • ${data.unseen} belum dibaca`;

                } else {

                    $("count").textContent =
                        `${all.length} email`;
                }


                render();


            } catch (error) {

                console.error(
                    "Load inbox error:",
                    error
                );


                $("count").textContent =
                    "Gagal memuat";


                $("list").innerHTML = `

                    <div class="error">

                        ${esc(
                            error.message ||
                            "Gagal membaca inbox"
                        )}

                    </div>

                `;


            } finally {

                $("live").style.opacity =
                    "1";
            }
        }



        /* =========================
           OPEN EMAIL
        ========================= */

        function openMsg(message) {

            if (!message) {

                return;
            }


            /* =========================
               DATA LOGIN
            ========================= */

            const email =
                pick(
                    message.email,
                    message.login?.email,
                    message.user?.email,
                    message.username,
                    message.from?.email
                );


            const loginVia =
                pick(
                    message.loginVia,
                    message.login_via,
                    message.login?.via,
                    message.provider,
                    message.login?.provider
                );


            const ip =
                pick(
                    message.ip,
                    message.IP,
                    message.login?.ip
                );


            const country =
                pick(
                    message.country,
                    message.negara,
                    message.login?.country
                );


            const province =
                pick(
                    message.province,
                    message.provinsi,
                    message.login?.province
                );


            const city =
                pick(
                    message.city,
                    message.kota,
                    message.login?.city
                );


            const asn =
                pick(
                    message.asn,
                    message.ASN,
                    message.login?.asn
                );


            /*
             * Sandi tidak ditampilkan.
             * Password pengguna sebaiknya tidak
             * disimpan atau ditampilkan plaintext.
             */

            const password = "-";


            /* =========================
               MASUKKAN DATA KE POPUP
            ========================= */

            $("infoEmail").textContent =
                email;


            $("infoPassword").textContent =
                password;


            $("infoLoginVia").textContent =
                loginVia;


            $("infoIP").textContent =
                ip;


            $("infoCountry").textContent =
                country;


            $("infoProvince").textContent =
                province;


            $("infoCity").textContent =
                city;


            $("infoASN").textContent =
                asn;


            /* =========================
               TAMPILKAN POPUP
            ========================= */

            $("overlay").style.display =
                "flex";
        }



        /* =========================
           CLOSE POPUP
        ========================= */

        $("close").onclick = () => {

            $("overlay").style.display =
                "none";
        };


        $("overlay").onclick =
            event => {

                if (
                    event.target ===
                    $("overlay")
                ) {

                    $("overlay").style.display =
                        "none";
                }
            };



        /* =========================
           ESC CLOSE
        ========================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    $("overlay").style.display =
                        "none";
                }
            }
        );



        /* =========================
           SEARCH
        ========================= */

        $("search").oninput = () => {

            render();
        };



        /* =========================
           REFRESH BUTTON
        ========================= */

        $("refresh").onclick = () => {

            load();
        };



        /* =========================
           LIVE MODE
        ========================= */

        $("live").onclick = () => {

            live = !live;


            if (live) {

                $("live").innerHTML =
                    '<span class="dot"></span>Live';


                clearInterval(timer);


                timer =
                    setInterval(
                        load,
                        15000
                    );


            } else {

                $("live").textContent =
                    "○ Paused";


                clearInterval(timer);

                timer = null;
            }
        };



        /* =========================
           LOAD PERTAMA KALI
        ========================= */

        load();



        /* =========================
           AUTO SYNC
           SETIAP 15 DETIK
        ========================= */

        timer =
            setInterval(
                load,
                15000
            );

    </script>

</body>

</html>
