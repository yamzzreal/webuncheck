<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Yamzz Mail</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b11;color:#edf4ff;font-family:Inter,system-ui,Arial;display:grid;place-items:center;padding:20px}.box{width:min(420px,100%);background:#0d1425;border:1px solid #213455;border-radius:24px;padding:26px;box-shadow:0 20px 70px #0008}.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#2878ff,#1449c7);display:grid;place-items:center;font-weight:900;margin-bottom:18px}h1{margin:0 0 8px}p{color:#8594ad;margin:0 0 22px}label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #263b5d;background:#09111f;color:white;outline:none}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:12px;background:#2677ff;color:white;font-weight:800;font-size:15px}.err{margin-top:14px;color:#ff9da9;background:#3d1b24;padding:12px;border-radius:10px;display:none}.admin{display:block;text-align:center;margin-top:18px;color:#7797c5;text-decoration:none;font-size:13px}
</style></head><body><main class="box"><div class="logo">YM</div><h1>Yamzz Mail</h1><p>Masukkan access key untuk membuka inbox.</p><form id="f"><label>Access Key</label><input id="key" autocomplete="off" placeholder="FREE_... / PAID_..." required><button>Masuk ke Inbox</button></form><div class="err" id="err"></div><a class="admin" href="/generate.html">Generate Key Free</a><a class="admin" href="/admin.html">Panel Admin</a></main><script>
const f=document.getElementById('f'),err=document.getElementById('err');f.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';const b=e.target.querySelector('button');b.disabled=true;b.textContent='Memeriksa...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.getElementById('key').value.trim()})});const d=await r.json();if(!d.success)throw Error(d.message);location.href='/';}catch(x){err.textContent=x.message;err.style.display='block';b.disabled=false;b.textContent='Masuk ke Inbox';}});
</script></body></html>
