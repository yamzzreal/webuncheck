<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login • Yamzz Mail</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b11;color:#edf4ff;font-family:Inter,system-ui,Arial;display:grid;place-items:center;padding:20px}.box{width:min(410px,100%);background:#0d1425;border:1px solid #213455;border-radius:23px;padding:25px}.logo{font-size:30px;font-weight:900;color:#5ca6ff;margin-bottom:12px}h1{margin:0 0 7px}p{color:#8190aa;margin-bottom:20px}label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #29405f;background:#09111f;color:white}button{width:100%;margin-top:15px;padding:14px;border:0;border-radius:11px;background:#2879ff;color:white;font-weight:800}.err{display:none;margin-top:12px;padding:11px;background:#3d1b24;color:#ff9da9;border-radius:10px}</style></head><body><main class="box"><div class="logo">YM ADMIN</div><h1>Panel Admin</h1><p>Masukkan password admin untuk mengelola access key.</p><form id="f"><label>Password Admin</label><input id="p" type="password" required><button>Login Admin</button></form><div class="err" id="e"></div></main><script>f.onsubmit=async x=>{x.preventDefault();e.style.display='none';try{let r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})}),d=await r.json();if(!d.success)throw Error(d.message);location.href='/admin.html'}catch(x){e.textContent=x.message;e.style.display='block'}};</script></body></html>
