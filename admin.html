<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin • Yamzz Mail</title><style>
:root{--bg:#080b12;--panel:#0d1425;--line:#203352;--text:#edf4ff;--muted:#8190aa;--blue:#2879ff;--green:#20c78a;--red:#ff6478;--pink:#d45cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial;padding-bottom:86px}.top{height:72px;background:#11131b;border-bottom:1px solid #20283a;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:18px;flex:1}.badge{font-size:12px;background:#16233d;color:#78aaff;padding:7px 10px;border-radius:9px}.wrap{max-width:900px;margin:auto;padding:18px 15px}.section{display:none}.section.active{display:block}h2{margin:4px 0 6px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}.form{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:700;color:#aab7ca;display:block;margin:0 0 7px}input,select{width:100%;padding:13px;border:1px solid #29405f;background:#09111f;color:#fff;border-radius:11px;outline:none}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-weight:800;margin-top:14px}.result{display:none;margin-top:13px;padding:12px;border-radius:11px;background:#0e3328;color:#86f1c7;word-break:break-all}.keys{display:grid;gap:10px}.key{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px}.keytop{display:flex;gap:8px;align-items:center}.keycode{font-weight:900;word-break:break-all;flex:1}.plan{padding:5px 8px;border-radius:7px;font-size:11px;font-weight:900}.free{background:#123a36;color:#5ee0bc}.paid{background:#35234b;color:#e2a5ff}.meta{color:var(--muted);font-size:12px;margin-top:8px}.actions{display:flex;gap:7px;margin-top:12px}.small{padding:8px 10px;border:0;border-radius:9px;background:#1a2942;color:#cfe0fa;font-weight:700}.danger{background:#3c1c25;color:#ff9ba9}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0e1320;border-top:1px solid #22304a;display:flex;justify-content:center;z-index:8}.nav{max-width:900px;width:100%;display:flex}.nav button{flex:1;background:none;border:0;color:#71809b;padding:12px 5px 11px;font-weight:700;font-size:11px}.nav button.active{color:#55a5ff}.ico{display:block;font-size:20px;margin-bottom:4px}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{height:64px}}
</style></head><body><header class="top"><div class="brand">Yamzz Mail Admin</div><span class="badge">ADMIN</span><button class="small" id="logout">Keluar</button></header><main class="wrap">
<section class="section active" id="s-list"><h2>List Key</h2><div class="sub">Kelola semua access key dan masa aktifnya.</div><div class="keys" id="keys">Memuat...</div></section>
<section class="section" id="s-paid"><h2>Buat Key Berbayar</h2><div class="sub">Buat access key untuk pengguna berbayar.</div><div class="form"><div class="grid"><div><label>Durasi</label><input id="paidDur" type="number" min="1" value="30"></div><div><label>Satuan</label><select id="paidUnit"><option value="day">Hari</option><option value="week">Minggu</option><option value="month">Bulan</option><option value="year">Tahun</option></select></div></div><button class="btn" onclick="createKey('paid')">Buat Key Berbayar</button><div class="result" id="paidResult"></div></div></section>
<section class="section" id="s-free"><h2>Key Pengguna Free</h2><div class="sub">Atur durasi lalu buat key free untuk pengguna.</div><div class="form"><div class="grid"><div><label>Durasi Free</label><input id="freeDur" type="number" min="1" value="1"></div><div><label>Satuan</label><select id="freeUnit"><option value="hour">Jam</option><option value="day" selected>Hari</option><option value="week">Minggu</option></select></div></div><button class="btn" onclick="createKey('free')">Buat Key Free</button><div class="result" id="freeResult"></div></div></section>
</main><nav class="bottom"><div class="nav"><button class="active" data-tab="list"><span class="ico">☷</span>List Key</button><button data-tab="paid"><span class="ico">＋</span>Key Berbayar</button><button data-tab="free"><span class="ico">♙</span>Key Free</button></div></nav>
<script>
const $=id=>document.getElementById(id);document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$('s-'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='list')loadKeys()});
function fmt(d){return new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function loadKeys(){try{const r=await fetch('/api/admin-keys',{cache:'no-store'}),d=await r.json();if(!d.success){location.href='/admin-login.html';return}const now=Date.now();$('keys').innerHTML=d.keys.length?d.keys.map(k=>{const exp=new Date(k.expires_at).getTime(),expired=exp<=now;return `<article class="key"><div class="keytop"><div class="keycode">${esc(k.key_value)}</div><span class="plan ${k.plan}">${k.plan.toUpperCase()}</span></div><div class="meta">${expired?'EXPIRED':'Aktif sampai'} • ${fmt(k.expires_at)}<br>Dibuat ${fmt(k.created_at)}</div><div class="actions"><button class="small" onclick="extendKey(${k.id})">+ Durasi</button><button class="small ${k.active?'danger':''}" onclick="toggleKey(${k.id},${k.active})">${k.active?'Nonaktifkan':'Aktifkan'}</button></div></article>`}).join(''):'<div class="sub">Belum ada key.</div>'}catch(e){$('keys').textContent=e.message}}
async function createKey(plan){const dur=Number($(plan==='paid'?'paidDur':'freeDur').value),unit=$(plan==='paid'?'paidUnit':'freeUnit').value;const r=await fetch('/api/admin-keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,duration:dur,unit})});const d=await r.json();const box=$(plan==='paid'?'paidResult':'freeResult');box.style.display='block';box.textContent=d.success?'KEY: '+d.key+' | Expired: '+fmt(d.expires_at):d.message;if(d.success)loadKeys()}
async function extendKey(id){const dur=prompt('Tambah berapa hari?','7');if(!dur)return;const r=await fetch('/api/admin-keys',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action:'extend',duration:Number(dur),unit:'day'})});const d=await r.json();if(!d.success)alert(d.message);loadKeys()}
async function toggleKey(id,active){const r=await fetch('/api/admin-keys',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action:active?'disable':'enable'})});const d=await r.json();if(!d.success)alert(d.message);loadKeys()}
$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/admin-login.html'};loadKeys();
</script></body></html>
